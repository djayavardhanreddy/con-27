version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: con27-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=supersecretjwttokenkey987654321!
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: con27-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
